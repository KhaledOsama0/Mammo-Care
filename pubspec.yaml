name: mammo_care
description: "Mammo Care — AI-powered breast health screening app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cached_network_image: ^3.4.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: any
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logos/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logos/logo.png"
    background_color: "#F5F9FA"
    theme_color: "#244B5E"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/icons/
